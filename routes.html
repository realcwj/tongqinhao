<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<body class="routes-page">
  <div class="ambient" aria-hidden="true">
    <span class="ambient__orb ambient__orb--mint"></span>
    <span class="ambient__orb ambient__orb--sky"></span>
    <span class="ambient__orb ambient__orb--lavender"></span>
    <span class="ambient__orb ambient__orb--peach"></span>
    <span class="ambient__orb ambient__orb--aqua"></span>
    <span class="ambient__orb ambient__orb--rose"></span>
  </div>
  <svg class="glass-defs" aria-hidden="true" focusable="false">
    <filter id="glass-distort" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="2" seed="7" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="1.4" result="soft" />
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="30" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <div class="page-shell">
    <header class="routes-hero">
      <nav class="topbar" aria-label="主导航">
        <a class="brand" href="./index.html" aria-label="通琴号首页">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <path d="M4 6.5h16a2 2 0 0 1 2 2V17H2V8.5a2 2 0 0 1 2-2Z"></path>
              <path d="M2 12h20"></path>
              <path d="M7 6.5v5.5M17 6.5v5.5"></path>
              <circle cx="7" cy="18.8" r="1.5"></circle>
              <circle cx="17" cy="18.8" r="1.5"></circle>
            </svg>
          </span>
          <span>
            <strong>通琴号</strong>
            <small>跨岛通勤助手 · 三地通勤班次查询</small>
          </span>
        </a>
        <div class="topbar__actions">
          <a class="status-pill status-pill--link" href="https://github.com/realcwj/tongqinhao" target="_blank" rel="noopener">
            <svg class="status-pill__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
            <span>realcwj/tongqinhao</span>
          </a>
          <a class="status-pill status-pill--link" data-sync-pill href="https://github.com/realcwj/tongqinhao/blob/main/processed.json" target="_blank" rel="noopener"><i></i><span data-sync-label>数据同步</span></a>
        </div>
      </nav>
      <div class="routes-hero__content">
        <div class="routes-hero__intro">
          <span class="section-kicker">ROUTE DIRECTORY</span>
          <h1>全部<em>线路</em></h1>
          <p>横琴、澳门、珠海三地双向通勤班次及完整站点时刻</p>
          <div class="region-legend" aria-label="三地配色">
            <span class="region-legend__item region-legend__item--hengqin"><i></i>横琴</span>
            <span class="region-legend__item region-legend__item--macau"><i></i>澳门</span>
            <span class="region-legend__item region-legend__item--zhuhai"><i></i>珠海</span>
          </div>
        </div>
        <a class="routes-button routes-button--back" href="index.html" aria-label="返回主页查询后续班次">
          <span class="routes-button__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>
          </span>
          <span><strong>返回主页</strong><small>查询后续班次</small></span>
          <span class="routes-button__arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </div>
    </header>

    <main class="routes-main">
      <section class="route-toolbar" aria-label="线路筛选">
        <label class="route-search" for="routeSearch">
          <span class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" focusable="false"><circle cx="9" cy="9" r="5.2"/><path d="m13 13 3.4 3.4"/></svg>
          </span>
          <input id="routeSearch" type="search" placeholder="搜索线路或站点" autocomplete="off" />
        </label>
        <div class="route-filters" id="routeFilters" role="group" aria-label="线路方向">
          <button type="button" class="is-selected" data-filter="all">全部</button>
          <button type="button" data-filter="1-2">横琴 → 澳门</button>
          <button type="button" data-filter="2-1">澳门 → 横琴</button>
          <button type="button" data-filter="1-3">横琴 → 珠海</button>
          <button type="button" data-filter="3-1">珠海 → 横琴</button>
        </div>
      </section>

      <div class="route-results-heading">
        <div><span class="section-kicker">AVAILABLE ROUTES</span><h2>可用线路</h2></div>
        <span id="routeCount">正在加载…</span>
      </div>
      <div class="route-directory" id="routeDirectory"></div>
      <div class="empty-state" id="routeEmpty" hidden>
        <div class="empty-state__icon">⌕</div>
        <h3>没有匹配的线路</h3>
        <p>请调整关键词或方向筛选。</p>
      </div>
    </main>

    <footer class="footer">
      <span>通琴号 · 跨岛通勤助手 · 三地通勤班次查询</span>
      <span><a href="index.html">返回通勤助手</a> · <a href="https://github.com/realcwj/tongqinhao" target="_blank" rel="noopener">GitHub 仓库</a> · 数据来源于公开接口</span>
    </footer>
  </div>
  <script src="config.js?v=20261026-palette-unify1" defer></script>
  <script src="routes.js?v=20261026-motion4" defer></script>
</body>
</html>
